name: NBA report
on:
  push:
  workflow_dispatch:
  schedule:
    # 14:00 and 14:25 in Yekaterinburg (UTC+5).
    - cron: '0 9 * * *'
    - cron: '25 9 * * *'

concurrency:
  group: nba-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      publish: ${{ steps.check-report.outputs.publish }}
    steps:
      - name: Check for today's published report
        id: check-report
        env:
          RUN_EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, time
          from datetime import datetime, timezone
          from urllib.request import urlopen

          publish = True
          if os.environ['RUN_EVENT'] == 'schedule':
              today = datetime.now(timezone.utc).replace(hour=9, minute=0, second=0, microsecond=0)
              url = 'https://kirillboayrskiy660-blip.github.io/nba-totals/report.json'
              try:
                  with urlopen(f'{url}?check={int(time.time())}', timeout=10) as response:
                      report = json.load(response)
                  started = datetime.fromisoformat(report['startedAt'])
                  publish = started < today or any(row[2] == 'Ошибка источника' for row in report['status'])
              except (OSError, ValueError, KeyError, TypeError) as error:
                  print(f'Could not verify the latest report: {error}')
              if not publish:
                  print('A current report is already published.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'publish={str(publish).lower()}\n')
          PY
      - uses: actions/checkout@v5
        if: steps.check-report.outputs.publish == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        if: steps.check-report.outputs.publish == 'true'
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        if: steps.check-report.outputs.publish == 'true'
      - run: npm run build
        if: steps.check-report.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.check-report.outputs.publish == 'true'
        with:
          path: dist
  publish:
    needs: collect
    if: needs.collect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish report
        id: deployment
        uses: actions/deploy-pages@v4
